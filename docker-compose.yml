services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: grpc_tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: grpc-tasks
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/grpc_tasks?sslmode=disable
      HTTP_PORT: 8080
      GRPC_PORT: 50051
      JWT_SECRET: dev-secret-change-in-prod
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
